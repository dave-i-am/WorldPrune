services:
  paper-test-server:
    image: itzg/minecraft-server:latest
    container_name: paper-test-server
    environment:
      EULA: "TRUE"
      TYPE: PAPER
      VERSION: "${MINECRAFT_VERSION:-1.21.4}"
      ONLINE_MODE: "FALSE"
      ENABLE_RCON: "true"
      RCON_PASSWORD: minecraft
      RCON_PORT: "25575"
      # Optional Modrinth projects to install for integration.
      MODRINTH_PROJECTS: "${MODRINTH_PROJECTS-}"
      # Optional direct plugin URLs.
      PLUGINS: "${PAPER_PLUGIN_URLS-}"
    ports:
      - "25565:25565"
    stdin_open: true
    tty: true
