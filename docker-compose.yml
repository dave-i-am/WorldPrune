services:
  paper-test-server:
    image: itzg/minecraft-server:latest
    container_name: paper-test-server
    environment:
      EULA: "TRUE"
      TYPE: PAPER
      VERSION: 26.1.1
      ONLINE_MODE: "FALSE"
      ENABLE_RCON: "true"
      RCON_PASSWORD: minecraft
      RCON_PORT: "25575"
    ports:
      - "25565:25565"
    stdin_open: true
    tty: true
